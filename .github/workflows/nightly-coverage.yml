name: Nightly Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-coverage-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure llvm coverage tools
        run: rustup component add llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install required binaries with cargo-binstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # rust-cache restores ~/.cargo/.crates.toml but prunes ~/.cargo/bin of
          # binstall-installed binaries, so binstall says "already installed"
          # while the binary is gone. --force sidesteps that.
          #
          # --disable-strategies compile: on an api.github.com 403 (anonymous
          # rate limit, or a token that ran out of budget) binstall does not
          # fail -- it silently falls back to `cargo install <tool>` WITHOUT
          # --locked. cargo-nextest carries a deliberate compile_error!
          # rejecting exactly that, so the job burns ~11 minutes compiling and
          # then exits 70 looking like a Rust build break. Disabling the
          # compile strategy turns that into an immediate, honest failure.
          # All three tools ship prebuilt binaries, so the fast path is intact.
          cargo binstall -y --force --disable-strategies compile cargo-nextest
          cargo binstall -y --force --disable-strategies compile cargo-llvm-cov
          cargo binstall -y --force --disable-strategies compile greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov
          greentic-dev --version

      - name: Run coverage and enforce policy
        run: greentic-dev coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: target/coverage/coverage.json
          if-no-files-found: ignore
