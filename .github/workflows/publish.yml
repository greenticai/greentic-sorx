name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install i18n translator
        run: cargo binstall -y greentic-i18n-translator

      - name: Read Cargo version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "greentic-sorx"))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Publish must run from the main branch so it can create and release the matching version tag." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "Publish must run from main or master, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Run local checks
        run: bash ci/local_check.sh

      - name: Create or verify release tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          head_sha="$(git rev-parse HEAD)"
          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "Tag ${tag} already exists at ${tag_sha}, but this publish run is for ${head_sha}." >&2
              exit 1
            fi
            echo "Tag ${tag} already points at this commit."
          else
            git tag "${tag}" "${head_sha}"
            git push origin "refs/tags/${tag}"
          fi

  release-binaries:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release-binaries.yml on version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run release-binaries.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_TAG}"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-binaries.yml/runs?event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs | map(select(.head_branch == \"${RELEASE_TAG}\" and .head_sha == \"${RELEASE_SHA}\")) | sort_by(.created_at) | last | .id // empty")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Could not find release-binaries.yml run for ${RELEASE_TAG} at ${RELEASE_SHA}." >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status

  publish-crates:
    runs-on: ubuntu-latest
    needs:
      - verify
      - release-binaries
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          members = set(metadata.get("workspace_members", []))
          publishable = {
              package["name"]: package
              for package in metadata["packages"]
              if (not members or package["id"] in members)
              and package.get("publish") is not False
              and package.get("publish") != []
          }
          visited = set()
          order = []

          def visit(name):
              if name in visited:
                  return
              visited.add(name)
              package = publishable[name]
              for dependency in package.get("dependencies", []):
                  dep_name = dependency["name"]
                  if dependency.get("kind") in ("dev", "build"):
                      continue
                  if dep_name in publishable:
                      visit(dep_name)
              order.append(package["name"])

          for name in publishable:
              visit(name)

          print("\n".join(order))
          ' > /tmp/publishable-crates.txt

          if [ ! -s /tmp/publishable-crates.txt ]; then
            echo "No publishable crates detected."
            exit 0
          fi

          while IFS= read -r crate; do
            echo "::group::${crate}"
            dry_attempt=1
            until cargo publish -p "$crate" --dry-run; do
              if [ "$dry_attempt" -ge 3 ]; then
                echo "Dry-run publishing ${crate} failed after ${dry_attempt} attempts." >&2
                exit 1
              fi
              sleep $((dry_attempt * 20))
              dry_attempt=$((dry_attempt + 1))
            done

            attempt=1
            until cargo publish -p "$crate"; do
              if [ "$attempt" -ge 3 ]; then
                echo "Publishing ${crate} failed after ${attempt} attempts." >&2
                exit 1
              fi
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            done
            echo "::endgroup::"
          done < /tmp/publishable-crates.txt
