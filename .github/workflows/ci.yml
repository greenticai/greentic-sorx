name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    # This gate deliberately omits --all-features. Two optional features would
    # otherwise be pulled in and neither is buildable on a stock CI runner:
    #   * `foundationdb` needs a native FDB client lib + headers (default-off,
    #     verified by the dedicated FDB integration tests against a real
    #     fdbserver);
    #   * `wasm-extensions` pulls the git-pinned `greentic-ext-runtime`
    #     (default-off, verified by feature-gated adapter tests) and would need
    #     credentials to fetch its private repo.
    # Both are default-off, so dropping --all-features here keeps the gate
    # coverage-relevant and credential-free.
    with:
      clippy-args: "--workspace --all-targets -- -D warnings"
      test-args: "--workspace"
