name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    # `foundationdb` is the only optional feature and needs a native FDB client
    # lib + headers that CI runners don't have, so it cannot be built via
    # --all-features here. It's default-off and verified by the dedicated FDB
    # integration tests (run against a real fdbserver). Dropping --all-features
    # is coverage-neutral: foundationdb is the sole feature in the workspace.
    with:
      clippy-args: "--workspace --all-targets -- -D warnings"
      test-args: "--workspace"
