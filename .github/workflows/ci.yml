name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    # This gate deliberately omits --all-features. Two optional features would
    # otherwise be pulled in and neither is buildable on a stock CI runner:
    #   * `foundationdb` needs a native FDB client lib + headers (default-off,
    #     verified by the dedicated FDB integration tests against a real
    #     fdbserver);
    #   * `wasm-extensions` pulls the git-pinned `greentic-ext-runtime`
    #     (default-off, verified by feature-gated adapter tests) and would need
    #     credentials to fetch its private repo.
    # Both are default-off, so dropping --all-features here keeps the gate
    # coverage-relevant and credential-free.
    with:
      clippy-args: "--workspace --all-targets -- -D warnings"
      test-args: "--workspace"

  # The postgres store's integration tests SKIP when SORX_TEST_POSTGRES_URL is
  # unset, which is every other job here. This one gives them a real database,
  # so the unique-index and multi-writer guarantees are checked on every PR
  # rather than only on a developer box.
  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sorx
          POSTGRES_DB: sorx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SORX_TEST_POSTGRES_URL: postgres://postgres:sorx@127.0.0.1:5432/sorx?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Postgres store tests
        run: |
          cargo test -p greentic-sorx-core --features postgres --lib providers::
          cargo test -p greentic-sorx-core --features postgres --test postgres_store
