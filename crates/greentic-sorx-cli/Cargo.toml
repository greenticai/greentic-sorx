[package]
name = "greentic-sorx"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for the Greentic System of Record eXecutor."
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "i18n/**",
    "src/**",
    "benches/**",
    "tests/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }"
pkg-fmt = "tgz"
bin = ["greentic-sorx"]

[lib]
name = "greentic_sorx_cli"

[[bin]]
name = "greentic-sorx"
path = "src/main.rs"

[[bench]]
name = "perf"
harness = false

[features]
## Enable the NATS-backed business event sink and the async runtime dispatch
## (`sorla.call`) event bridge (adds async-nats + tokio + the event-bridge crate).
## The business-event sink is wired automatically when events.sink = "nats" in the
## runtime config; the dispatch bridge additionally activates at runtime when
## GREENTIC_EVENTS_NATS_URL is set.
events-nats = [
    "dep:async-nats",
    "dep:tokio",
    "dep:async-trait",
    "dep:anyhow",
    "dep:sorx-event-bridge",
]

## Enable running WASM extension packs via greentic-ext-runtime (wasmtime-based
## host for Greentic Designer Extensions), so sorx can dispatch to the
## sorx-runtime-extension world.
wasm-extensions = ["dep:greentic-ext-runtime"]

## Dev/test-only: additionally enables greentic-ext-runtime's
## `dev-allow-unsigned` gate (honors `GREENTIC_EXT_ALLOW_UNSIGNED=1` to skip
## signature verification). Used by the WASM extension e2e test to load a
## dev-unsigned guest fixture. Never enable in production builds.
wasm-extensions-dev-unsigned = ["wasm-extensions", "greentic-ext-runtime/dev-allow-unsigned"]

[dependencies]
anyhow = { version = "1", optional = true }
async-nats = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
sorx-event-bridge = { path = "../sorx-event-bridge", optional = true }
greentic-ext-runtime = { git = "https://github.com/greentic-biz/greentic-designer-extensions", rev = "c28e9577dbb3227fe38c20e948b2d8b036fdc26e", optional = true }
chrono.workspace = true
ciborium.workspace = true
clap.workspace = true
greentic-qa-lib = "0.5"
greentic-sorx-core.workspace = true
greentic-sorx-pack.workspace = true
greentic-types.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, optional = true }
jsonwebtoken = "9"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip.workspace = true

[dev-dependencies]
async-nats.workspace = true
ciborium.workspace = true
criterion.workspace = true
futures = "0.3"
semver.workspace = true
tokio = { workspace = true, features = ["time"] }
