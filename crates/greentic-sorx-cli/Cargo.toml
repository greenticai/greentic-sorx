[package]
name = "greentic-sorx"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for the Greentic System of Record eXecutor."
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "i18n/**",
    "src/**",
    "benches/**",
    "tests/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }"
pkg-fmt = "tgz"
bin = ["greentic-sorx"]

[lib]
name = "greentic_sorx_cli"

[[bin]]
name = "greentic-sorx"
path = "src/main.rs"

[[bench]]
name = "perf"
harness = false

[features]
## Enable the NATS-backed business event sink (adds async-nats + tokio dependencies).
## Wired automatically when events.sink = "nats" in the runtime config.
events-nats = ["dep:async-nats", "dep:tokio"]

[dependencies]
async-nats = { workspace = true, optional = true }
chrono.workspace = true
ciborium.workspace = true
clap.workspace = true
greentic-qa-lib = "0.5"
greentic-sorx-core.workspace = true
greentic-sorx-pack.workspace = true
greentic-types.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip.workspace = true

[dev-dependencies]
ciborium.workspace = true
criterion.workspace = true
semver.workspace = true
